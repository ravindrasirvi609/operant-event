services:
  postgres:
    image: postgres:17
    container_name: operant-event-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: operant
      POSTGRES_PASSWORD: operant_password
      POSTGRES_DB: operant_event
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: operant-event-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: