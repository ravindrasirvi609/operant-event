name: Deploy Production

# Trigger only after the CI workflow completes successfully on main.
# This ensures broken builds never reach production.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    # Skip if CI did not pass (e.g. failed or was cancelled).
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # Copy the deploy script from the repo to the server so the server
      # always runs the version-controlled script rather than a stale copy.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload deploy script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: infrastructure/scripts/deploy-operant-event.sh
          target: /home/ubuntu/
          strip_components: 2

      - name: Run deploy script
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            chmod +x /home/ubuntu/deploy-operant-event.sh
            /home/ubuntu/deploy-operant-event.sh
