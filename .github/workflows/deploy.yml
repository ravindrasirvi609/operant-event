name: Deploy Production

# Trigger only after the CI workflow completes successfully on main.
# This ensures broken builds never reach production.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    # Skip if CI did not pass (e.g. failed or was cancelled).
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Some Node.js distributions no longer ship Corepack. The remote
            # deployment script uses it to activate the pnpm version pinned in
            # package.json, so install it when the host does not provide it.
            if ! command -v corepack >/dev/null 2>&1; then
              npm install --global --prefix "$HOME/.local" corepack@0.31.0
              export PATH="$HOME/.local/bin:$PATH"
            fi
            /home/ubuntu/deploy-operant-event.sh
